name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact full commit to release
        required: true
        type: string
      release_tag:
        description: Immutable release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  test-wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_ref }}"
          test "${{ inputs.release_tag }}" = "v$(python -c 'import runpy; print(runpy.run_path("src/openagent_host_tools/_version.py")["__version__"])')"
      - name: Test twice and build universal wheel
        run: |
          python -m pip install -e ".[dev]" build
          pytest -q
          pytest -q
          python -m build --wheel
          version="$(python -c 'import runpy; print(runpy.run_path("src/openagent_host_tools/_version.py")["__version__"])')"
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install --no-cache-dir dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c \
            "import openagent_host_tools as h; assert h.__version__ == '$version'"
          "$RUNNER_TEMP/wheel-smoke/bin/openagent-host-tools" --help >/dev/null
      - name: Wheel checksum
        shell: bash
        run: |
          cd dist
          sha256sum *.whl > openagent-host-tools-wheel.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: |
            dist/*.whl
            dist/openagent-host-tools-wheel.sha256
          if-no-files-found: error

  native-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-2022
            platform: win32-x64
          - runner: windows-11-arm
            platform: win32-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision pinned OpenSSL for Windows ARM64
        if: matrix.platform == 'win32-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'openagent-vcpkg'
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout 114d9fe62faf35856b45cf55cb93b57028a45d63
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install openssl:arm64-windows-static-md
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_DIR=$(Join-Path $vcpkgRoot 'installed\arm64-windows-static-md')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev libx11-dev libxtst-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev libpipewire-0.3-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev pkg-config \
            xvfb xauth
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]" pyinstaller
      - name: Build self-contained native bundle
        run: python scripts/build_standalone.py --require-sidecars --expect-platform ${{ matrix.platform }}
      - name: Sign and notarize macOS runtime before hashing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bundle="dist/${{ matrix.platform }}"
          scripts/sign_macos_bundle.sh "$bundle"
          python scripts/build_standalone.py --manifest-only --expect-platform ${{ matrix.platform }}
      - name: Verify live sidecar catalogs match the version lock
        run: python scripts/snapshot_sidecar_manifests.py dist/${{ matrix.platform }} --check
      - name: Smoke signed frozen MCP and browser runtime with runner TCC grants
        if: runner.os == 'macOS'
        run: python scripts/smoke_bundle.py dist/${{ matrix.platform }} --computer-control expect-granted
      - name: Smoke frozen core and computer-control under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          xvfb-run -a -s '-screen 0 1280x1024x24'
          python scripts/smoke_bundle.py dist/${{ matrix.platform }}
          --core-only --computer-control expect-granted
      - name: Smoke frozen core MCP runtime
        if: runner.os == 'Windows'
        run: python scripts/smoke_bundle.py dist/${{ matrix.platform }} --core-only --computer-control skip
      - name: Package and checksum
        run: python scripts/package_bundle.py dist/${{ matrix.platform }}
      - name: Verify final macOS archive after extraction
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/verify_macos_archive.sh dist/openagent-host-tools-${{ matrix.platform }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            dist/openagent-host-tools-${{ matrix.platform }}.tar.gz
            dist/openagent-host-tools-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [test-wheel, native-bundle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify every detached checksum
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
      - name: Generate cross-client immutable release index
        run: python scripts/release_index.py artifacts --source-commit "${{ inputs.source_ref }}" --source-repository "$GITHUB_REPOSITORY"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ inputs.source_ref }}
          generate_release_notes: true
          files: |
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/release-index.json
