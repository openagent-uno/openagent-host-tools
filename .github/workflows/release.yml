name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v$(python -c 'import runpy; print(runpy.run_path("src/openagent_host_tools/_version.py")["__version__"])')"
      - name: Test twice and build universal wheel
        run: |
          python -m pip install -e ".[dev]" build
          pytest -q
          pytest -q
          python -m build --wheel
      - name: Wheel checksum
        shell: bash
        run: |
          cd dist
          sha256sum *.whl > openagent-host-tools-wheel.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: |
            dist/*.whl
            dist/openagent-host-tools-wheel.sha256
          if-no-files-found: error

  native-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-2022
            platform: win32-x64
          - runner: windows-11-arm
            platform: win32-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev libx11-dev libxtst-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev libpipewire-0.3-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev pkg-config
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]" pyinstaller
      - name: Build self-contained native bundle
        run: python scripts/build_standalone.py --require-sidecars --expect-platform ${{ matrix.platform }}
      - name: Sign and notarize macOS runtime before hashing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CSC_LINK:-}" || { echo "CSC_LINK is required for a macOS release"; exit 1; }
          test -n "${APPLE_ID:-}" || { echo "APPLE_ID is required for notarization"; exit 1; }
          test -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" || { echo "APPLE_APP_SPECIFIC_PASSWORD is required for notarization"; exit 1; }
          expected_team="B4KWCQFY8V"
          keychain="$RUNNER_TEMP/host-tools-sign.keychain"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          p12="$RUNNER_TEMP/host-tools-sign.p12"
          echo "$CSC_LINK" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity"
          bundle="dist/${{ matrix.platform }}"
          codesign --force --sign "$identity" --identifier com.openagent.host-tools.node --options runtime --timestamp --entitlements scripts/entitlements-node.plist "$bundle/node"
          codesign --force --sign "$identity" --identifier com.openagent.host-tools --options runtime --timestamp --entitlements scripts/entitlements-host.plist "$bundle/openagent-host-tools"
          codesign --force --sign "$identity" --identifier com.openagent.computer-control --options runtime --timestamp "$bundle/openagent-computer-control.app/Contents/MacOS/openagent-computer-control"
          codesign --force --sign "$identity" --identifier com.openagent.computer-control --options runtime --timestamp "$bundle/openagent-computer-control.app"
          codesign --verify --deep --strict --verbose=2 "$bundle/openagent-computer-control.app"
          codesign --verify --strict --verbose=2 "$bundle/openagent-host-tools"
          for target in "$bundle/node" "$bundle/openagent-host-tools" "$bundle/openagent-computer-control.app"; do
            actual_team="$(codesign -d --verbose=4 "$target" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            test "$actual_team" = "$expected_team" || { echo "unexpected TeamIdentifier $actual_team for $target"; exit 1; }
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/openagent-computer-control.app/Contents/Info.plist")" = "com.openagent.computer-control"
          "$bundle/node" -e "process.stdout.write('node-ok')" | grep -qx node-ok
          notary_zip="$RUNNER_TEMP/openagent-host-tools-${{ matrix.platform }}.zip"
          ditto -c -k --keepParent "$bundle" "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$expected_team" \
            --wait
          xcrun stapler staple "$bundle/openagent-computer-control.app"
          xcrun stapler validate "$bundle/openagent-computer-control.app"
          spctl --assess --type execute --verbose=4 "$bundle/openagent-computer-control.app"
          spctl --assess --type execute --verbose=4 "$bundle/openagent-host-tools"
          python scripts/build_standalone.py --manifest-only --expect-platform ${{ matrix.platform }}
      - name: Verify live sidecar catalogs match the version lock
        run: python scripts/snapshot_sidecar_manifests.py dist/${{ matrix.platform }} --check
      - name: Smoke signed frozen MCP and browser runtime
        if: runner.os == 'macOS'
        run: python scripts/smoke_bundle.py dist/${{ matrix.platform }}
      - name: Smoke frozen core MCP runtime
        if: runner.os != 'macOS'
        run: python scripts/smoke_bundle.py dist/${{ matrix.platform }} --core-only
      - name: Package and checksum
        run: python scripts/package_bundle.py dist/${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            dist/openagent-host-tools-${{ matrix.platform }}.tar.gz
            dist/openagent-host-tools-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [test-wheel, native-bundle, publish-pypi]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify every detached checksum
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
      - name: Generate cross-client immutable release index
        run: python scripts/release_index.py artifacts --source-commit "$GITHUB_SHA" --source-repository "$GITHUB_REPOSITORY"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/release-index.json

  publish-pypi:
    needs: [test-wheel, native-bundle]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/openagent-host-tools
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Verify wheel checksum
        shell: bash
        run: |
          cd dist
          sha256sum --check openagent-host-tools-wheel.sha256
          rm openagent-host-tools-wheel.sha256
      - name: Publish immutable wheel with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Verify a clean install from PyPI
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import runpy; print(runpy.run_path("src/openagent_host_tools/_version.py")["__version__"])')"
          python -m venv "$RUNNER_TEMP/pypi-smoke"
          for attempt in 1 2 3 4 5 6; do
            if "$RUNNER_TEMP/pypi-smoke/bin/pip" install --no-cache-dir "openagent-host-tools==$version"; then
              break
            fi
            test "$attempt" != 6
            sleep 10
          done
          "$RUNNER_TEMP/pypi-smoke/bin/python" -c \
            "import openagent_host_tools as h; assert h.__version__ == '$version'"
          "$RUNNER_TEMP/pypi-smoke/bin/openagent-host-tools" --help >/dev/null
