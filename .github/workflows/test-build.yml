name: test-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev libx11-dev libxtst-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev libpipewire-0.3-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev pkg-config
      - name: Install
        run: python -m pip install -e ".[dev]" pyinstaller
      - name: Test twice
        shell: bash
        run: |
          pytest -q
          pytest -q
      - name: Build standalone bundle
        run: python scripts/build_standalone.py --require-sidecars
      - name: Verify live sidecar catalogs match the version lock
        shell: bash
        run: python scripts/snapshot_sidecar_manifests.py dist/* --check
      - name: Smoke frozen core MCP runtime
        shell: bash
        run: python scripts/smoke_bundle.py dist/* --core-only
      - uses: actions/upload-artifact@v4
        with:
          name: openagent-host-tools-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
